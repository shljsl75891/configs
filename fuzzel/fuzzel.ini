# Colours and font mirror the old dmenu setup.
[main]
font=NotoSans Nerd Font:size=10
dpi-aware=no
anchor=top
y-margin=40
match-mode=fzf
prompt=Execute > 
lines=12
width=60
horizontal-pad=8
vertical-pad=4

[colors]
background=1d2021ff
text=d4be98ff
match=689d6aff
selection=689d6aff
selection-text=1d2021ff
selection-match=1d2021ff
border=689d6aff

[border]
width=1
radius=0
