# X11 libinput touchpad settings — mirrors the `input type:touchpad` block in
# sway/config. Install with:
#   sudo cp 40-touchpad.conf /etc/X11/xorg.conf.d/
#
# Note: sway's `scroll_factor 0.8` has no xorg libinput equivalent and is omitted.

Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"                 # sway: tap enabled
    Option "TappingDrag" "on"             # sway: drag enabled
    Option "TappingDragLock" "off"        # sway: drag_lock disabled
    Option "NaturalScrolling" "on"        # sway: natural_scroll enabled
    Option "ClickMethod" "buttonareas"    # sway: click_method button_areas
    Option "AccelProfile" "adaptive"      # sway: accel_profile adaptive
    Option "AccelSpeed" "0.1"             # sway: pointer_accel 0.1
    Option "DisableWhileTyping" "on"      # sway: dwt enabled
    Option "ScrollPixelDistance" "30"     # lower = faster scroll (default ~80-100px/click)
EndSection

Section "InputClass"
    Identifier "pointer"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelProfile" "flat"          # sway: input type:pointer accel_profile flat
    Option "AccelSpeed" "0"               # sway: pointer_accel 0
EndSection
